<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro</title>
  <link rel="stylesheet" href="estilos.css" />



</head>
<body>
  <div class="background">
    <div class="form-container">
      <h1 class="title">Registro</h1>
      <p class="subtitle">Date de alta al llenar los siguientes datos.</p>

      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Escribe tu nombre">
      </div>

      <div class="form-group">
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" placeholder="Escribe tu apellido">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="correo@ejemplo.com">
      </div>

      <div class="form-group">
        <label for="passwordInput">Contraseña</label>
        <div class="password-wrapper">
          <input type="password" id="passwordInput" placeholder="Introduce tu contraseña">
          <span id="togglePassword" class="toggle-icon">👁️</span>
        </div>
      </div>

      <a href="Pagina Principal.html" class="submit-button">Crear Cuenta</a>

      <p class="login-text">
        ¿Ya tienes una cuenta? <a class="bold" href="login.html">Inicia sesión</a>
      </p>
    </div>
  </div>

  <script>
    const passwordInput = document.getElementById("passwordInput");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      togglePassword.textContent = isPassword ? "🙈" : "👁️";
    });
  </script>
</body>
</html>
