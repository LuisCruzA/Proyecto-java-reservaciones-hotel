<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Hotel</title>
    <style>
        body {
            font-family: Times New Roman , sans-serif;
            background-color: #FFFF;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #000000;
            color: white;
            text-align: center;
            padding: 20px;
        }

        form {
            background-color: white;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin: 15px 0 5px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
        }

        button {
            background-color: #003366;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #resultado {
            margin-top: 20px;
            text-align: center;
        }
        .volver-inicio {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #003366;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        
        .volver-inicio:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }
        
        body {
            position: relative;
            font-family: Times New Roman, sans-serif;
            background-color: #FFFF;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        
        

        
    </style>
</head>
<body>

<header>
    <h1>Reservación de Habitaciones |    Hotel Presidencial</h1>
</header>

<form id="formReserva">
    <label for="nombre">Nombre completo:</label>
    <input type="text" id="nombre" required>

    <label for="email">Correo electrónico:</label>
    <input type="email" id="email" required>

    <label for="telefono">Teléfono:</label>
    <input type="tel" id="telefono" required>

    <label for="habitacion">Tipo de habitación:</label>
    <select id="habitacion" required>
        <option value="individual">Individual - $800/noche</option>
        <option value="doble">Doble - $1200/noche</option>
        <option value="suite">Suite - $1700/noche</option>
    </select>

    <label for="entrada">Fecha de entrada:</label>
    <input type="date" id="entrada" required>

    <label for="salida">Fecha de salida:</label>
    <input type="date" id="salida" required>

    <button type="submit">Reservar Ahora</button>
    
</form>
<a href="Pagina Principal.html" class="volver-inicio">← Volver al Inicio</a>

<div id="resultado"></div>

<script>
    document.getElementById('formReserva').addEventListener('submit', function(event) {
        event.preventDefault();

        const nombre = document.getElementById('nombre').value;
        const email = document.getElementById('email').value;
        const telefono = document.getElementById('telefono').value;
        const habitacion = document.getElementById('habitacion').value;
        const entrada = new Date(document.getElementById('entrada').value);
        const salida = new Date(document.getElementById('salida').value);

        if (salida <= entrada) {
            alert('La fecha de salida debe ser posterior a la de entrada');
            return;
        }

        const noches = Math.ceil((salida - entrada) / (1000 * 60 * 60 * 24));

        let precioPorNoche = 0;
        switch(habitacion) {
            case 'individual':
                precioPorNoche = 800;
                break;
            case 'doble':
                precioPorNoche = 1200;
                break;
            case 'suite':
                precioPorNoche = 1700;
                break;
        }

        const total = noches * precioPorNoche;

        document.getElementById('resultado').innerHTML = `
            <h2>¡Reserva confirmada!</h2>
            <p><strong>Nombre:</strong> ${nombre}</p>
            <p><strong>Email:</strong> ${email}</p>
            <p><strong>Teléfono:</strong> ${telefono}</p>
            <p><strong>Tipo de habitación:</strong> ${habitacion}</p>
            <p><strong>Fecha de entrada:</strong> ${entrada.toLocaleDateString()}</p>
            <p><strong>Fecha de salida:</strong> ${salida.toLocaleDateString()}</p>
            <p><strong>Noches:</strong> ${noches}</p>
            <p><strong>Total a pagar:</strong> $${total}</p>
            <p>En breve recibirá un correo con los detalles de su reserva.</p>
        `;
    });
</script>

</body>
</html>
